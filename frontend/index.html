<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ExoHabitAI - Habitability Predictor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">ExoHabitAI - Exoplanet Habitability Prediction</h2>

    <form id="predictionForm">
    <div class="row">

        <h5>Planetary Parameters</h5>

        <div class="col-md-4">
            <label>Planet Radius</label>
            <input type="number" step="any" class="form-control" id="pl_rade" value="1.2" required>
        </div>

        <div class="col-md-4">
            <label>Planet Mass</label>
            <input type="number" step="any" class="form-control" id="pl_masse" value="1.5" required>
        </div>

        <div class="col-md-4">
            <label>Semi-Major Axis</label>
            <input type="number" step="any" class="form-control" id="pl_orbsmax" value="0.95" required>
        </div>

        <div class="col-md-4 mt-3">
            <label>Equilibrium Temperature</label>
            <input type="number" step="any" class="form-control" id="pl_eqt" value="288" required>
        </div>

        <div class="col-md-4 mt-3">
            <label>Planet Density</label>
            <input type="number" step="any" class="form-control" id="pl_dens" value="5.5" required>
        </div>

        <div class="col-md-4 mt-3">
            <label>Orbital Period</label>
            <input type="number" step="any" class="form-control" id="pl_orber" value="365" required>
        </div>

        <h5 class="mt-4">Stellar Parameters</h5>

        <div class="col-md-4">
            <label>Star Temperature</label>
            <input type="number" step="any" class="form-control" id="st_teff" value="5800" required>
        </div>

        <div class="col-md-4">
            <label>Star Luminosity</label>
            <input type="number" step="any" class="form-control" id="st_lum" value="1.0" required>
        </div>

        <div class="col-md-4">
            <label>Stellar Metallicity</label>
            <input type="number" step="any" class="form-control" id="st_met" value="0.0" required>
        </div>

    </div>

    <button class="btn btn-primary mt-4" type="submit">
        Predict Habitability
    </button>
</form>


    <div id="result" class="mt-4"></div>
</div>

<script src="script.js"></script>
</body>
</html>
